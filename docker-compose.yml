services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: console
      POSTGRES_PASSWORD: ${DB_PASSWORD:-console}
      POSTGRES_DB: console
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Published so migrations and the dev servers on the host can reach it.
    # Set DB_PORT in .env if something else already owns 5432 (scripts/setup.sh
    # does that for you when it finds the port taken).
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U console"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
      target: api
    env_file: .env
    environment:
      DATABASE_URL: postgres://console:${DB_PASSWORD:-console}@postgres:5432/console
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8787:8787"

  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
      target: worker
    env_file: .env
    environment:
      DATABASE_URL: postgres://console:${DB_PASSWORD:-console}@postgres:5432/console
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
