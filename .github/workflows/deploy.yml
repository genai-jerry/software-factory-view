# Deploy the Factory Console to the Hostinger VPS Docker Manager.
#
# VPS: https://hpanel.hostinger.com/vps/1659755/docker-manager
# Checklist: infra/cloud.env.example
#
# GitHub Environment "production"
#   HOSTINGER_API_KEY      secret     hPanel → profile → API
#   HOSTINGER_VM_ID        variable   default 1659755 (from the VPS URL)
#   PUBLIC_ORIGIN          variable   https://your-hostname  (Traefik Host rule)
#   CONSOLE_MASTER_KEY     secret     openssl rand -base64 32
#   DB_PASSWORD            secret     postgres password for this VPS
#   GH_APP_ID              secret     required   platform GitHub App numeric id
#   GH_APP_PRIVATE_KEY     secret     required   PEM; store with \n for newlines
#   GH_APP_WEBHOOK_SECRET  secret     required
#   GH_OAUTH_CLIENT_ID     secret     required
#   GH_OAUTH_CLIENT_SECRET secret     required
#
# GitHub forbids secret names that start with GITHUB_. The GH_* secrets above
# are mapped to GITHUB_APP_* / GITHUB_OAUTH_* process env on the VPS.
#
# Private repo: add an SSH deploy key on the VPS to this GitHub repository
# (hPanel Docker Manager → docs: deploy from a private GitHub repository).
# Do not set DEV_FAKE_LOGIN=1.

name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: typecheck-test-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm -r build
      - run: pnpm test

  deploy:
    name: hostinger
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Require Hostinger credentials
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          CONSOLE_MASTER_KEY: ${{ secrets.CONSOLE_MASTER_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GH_APP_WEBHOOK_SECRET: ${{ secrets.GH_APP_WEBHOOK_SECRET }}
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
        run: |
          missing=
          [ -n "$HOSTINGER_API_KEY" ] || missing="$missing HOSTINGER_API_KEY"
          [ -n "$CONSOLE_MASTER_KEY" ] || missing="$missing CONSOLE_MASTER_KEY"
          [ -n "$DB_PASSWORD" ] || missing="$missing DB_PASSWORD"
          [ -n "$PUBLIC_ORIGIN" ] || missing="$missing PUBLIC_ORIGIN"
          [ -n "$GH_APP_ID" ] || missing="$missing GH_APP_ID"
          [ -n "$GH_APP_PRIVATE_KEY" ] || missing="$missing GH_APP_PRIVATE_KEY"
          [ -n "$GH_APP_WEBHOOK_SECRET" ] || missing="$missing GH_APP_WEBHOOK_SECRET"
          [ -n "$GH_OAUTH_CLIENT_ID" ] || missing="$missing GH_OAUTH_CLIENT_ID"
          [ -n "$GH_OAUTH_CLIENT_SECRET" ] || missing="$missing GH_OAUTH_CLIENT_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Set these on the GitHub Environment 'production':$missing"
            echo "HOSTINGER_API_KEY — hPanel → profile → API"
            echo "CONSOLE_MASTER_KEY — openssl rand -base64 32"
            echo "DB_PASSWORD — postgres password for this VPS"
            echo "PUBLIC_ORIGIN — variable, e.g. https://console.example.com"
            echo "GH_APP_* / GH_OAUTH_* — the SaaS GitHub App (id, PKCS#8 or PKCS#1 PEM, webhook secret, OAuth pair)"
            echo "HOSTINGER_VM_ID — variable, this VPS is 1659755"
            exit 1
          fi
      - name: Flatten GitHub App private key
        id: appkey
        env:
          PEM: ${{ secrets.GH_APP_PRIVATE_KEY }}
        run: python3 -c 'import os; pem=os.environ["PEM"].replace("\r\n","\n").strip(); flat=pem.replace("\n","\\n"); open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8").write("pem<<ENDPEM\n"+flat+"\nENDPEM\n")'
      - name: Hostname for Traefik
        id: host
        env:
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
        run: |
          host="${PUBLIC_ORIGIN#http://}"
          host="${host#https://}"
          host="${host%%/*}"
          host="${host%%:*}"
          if [ -z "$host" ]; then
            echo "::error::PUBLIC_ORIGIN must include a hostname, e.g. https://factory.example.com"
            exit 1
          fi
          echo "console_host=$host" >> "$GITHUB_OUTPUT"
      - name: Deploy to Hostinger VPS
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          VM_ID: ${{ vars.HOSTINGER_VM_ID || '1659755' }}
          REPO_URL: https://github.com/${{ github.repository }}
          ENV_VARS: |
            NODE_ENV=production
            DEV_FAKE_LOGIN=0
            TRAEFIK_ENABLE=true
            CONSOLE_HOST=${{ steps.host.outputs.console_host }}
            PUBLIC_ORIGIN=${{ vars.PUBLIC_ORIGIN }}
            CONSOLE_MASTER_KEY=${{ secrets.CONSOLE_MASTER_KEY }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            GITHUB_APP_ID=${{ secrets.GH_APP_ID }}
            GITHUB_APP_PRIVATE_KEY=${{ steps.appkey.outputs.pem }}
            GITHUB_APP_WEBHOOK_SECRET=${{ secrets.GH_APP_WEBHOOK_SECRET }}
            GITHUB_OAUTH_CLIENT_ID=${{ secrets.GH_OAUTH_CLIENT_ID }}
            GITHUB_OAUTH_CLIENT_SECRET=${{ secrets.GH_OAUTH_CLIENT_SECRET }}
        run: |
          # hostinger/deploy-on-vps@v2 posts a /blob/<sha>/ URL. Hostinger only
          # accepts https://github.com/owner/repo (or raw compose). This repo is
          # private, so the blob URL 404s. The repo URL lets Docker Manager clone
          # via the VPS deploy key. Do not publish :80 — Traefik already owns it.
          body=$(jq -n \
            --arg content "$REPO_URL" \
            --arg project_name "factory-console" \
            --arg environment "$ENV_VARS" \
            '{project_name: $project_name, content: $content, environment: $environment}')
          echo "Deploying $REPO_URL as factory-console on VM $VM_ID (Traefik host ${{ steps.host.outputs.console_host }})"
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $HOSTINGER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$body" \
            "https://developers.hostinger.com/api/vps/v1/virtual-machines/${VM_ID}/docker")
          http_body=$(printf '%s\n' "$response" | sed '$d')
          http_status=$(printf '%s\n' "$response" | tail -n1)
          if [ "$http_status" -ge 200 ] && [ "$http_status" -lt 300 ]; then
            echo "Hostinger accepted the deploy ($http_status)"
            exit 0
          fi
          echo "::error::Hostinger deploy failed ($http_status): $http_body"
          echo "If the message is about cloning or 404, add a VPS SSH deploy key to this private repository."
          echo "If the message is about port 80, Traefik already binds it — do not set WEB_HOST_PORT=80."
          exit 1
