# Deploy Factory Console the same way Sales OS does: build images in CI,
# scp tarballs to the VPS, docker load, docker compose up.
#
# GitHub Environment "production"
#   DEPLOY_HOST / DEPLOY_USER / DEPLOY_KEY   same SSH trio as lighthouse-sales
#   PUBLIC_ORIGIN                            https://sf.genaipeople.com
#   CONSOLE_MASTER_KEY                       openssl rand -base64 32
#   DB_PASSWORD                              in-compose Postgres password
#   GH_APP_ID / GH_APP_PRIVATE_KEY / GH_APP_WEBHOOK_SECRET
#   GH_OAUTH_CLIENT_ID / GH_OAUTH_CLIENT_SECRET
#   ORCHESTRATOR_DISPATCH_TOKEN              optional, match factory-orchestrator DISPATCH_TOKEN
#   ORCHESTRATOR_URL                         optional variable, default http://factory-orchestrator:8080
#
# GitHub forbids secret names that start with GITHUB_. The GH_* secrets above
# are written to the VPS .env as GITHUB_APP_* / GITHUB_OAUTH_*.
# Do not set DEV_FAKE_LOGIN=1.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: typecheck-test-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm -r build
      - run: pnpm test

  deploy:
    name: vps
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Require deploy credentials
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          CONSOLE_MASTER_KEY: ${{ secrets.CONSOLE_MASTER_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GH_APP_WEBHOOK_SECRET: ${{ secrets.GH_APP_WEBHOOK_SECRET }}
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
        run: |
          missing=
          [ -n "$DEPLOY_HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$DEPLOY_USER" ] || missing="$missing DEPLOY_USER"
          [ -n "$DEPLOY_KEY" ] || missing="$missing DEPLOY_KEY"
          [ -n "$CONSOLE_MASTER_KEY" ] || missing="$missing CONSOLE_MASTER_KEY"
          [ -n "$DB_PASSWORD" ] || missing="$missing DB_PASSWORD"
          [ -n "$PUBLIC_ORIGIN" ] || missing="$missing PUBLIC_ORIGIN"
          [ -n "$GH_APP_ID" ] || missing="$missing GH_APP_ID"
          [ -n "$GH_APP_PRIVATE_KEY" ] || missing="$missing GH_APP_PRIVATE_KEY"
          [ -n "$GH_APP_WEBHOOK_SECRET" ] || missing="$missing GH_APP_WEBHOOK_SECRET"
          [ -n "$GH_OAUTH_CLIENT_ID" ] || missing="$missing GH_OAUTH_CLIENT_ID"
          [ -n "$GH_OAUTH_CLIENT_SECRET" ] || missing="$missing GH_OAUTH_CLIENT_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Set these on the GitHub Environment 'production':$missing"
            echo "DEPLOY_HOST / DEPLOY_USER / DEPLOY_KEY — copy from lighthouse-sales"
            echo "CONSOLE_MASTER_KEY — openssl rand -base64 32"
            echo "DB_PASSWORD — postgres password for this VPS"
            echo "PUBLIC_ORIGIN — variable, e.g. https://sf.genaipeople.com"
            echo "GH_APP_* / GH_OAUTH_* — the SaaS GitHub App"
            exit 1
          fi

      - name: Flatten GitHub App private key
        id: appkey
        env:
          PEM: ${{ secrets.GH_APP_PRIVATE_KEY }}
        run: python3 -c 'import os; pem=os.environ["PEM"].replace("\r\n","\n").strip(); flat=pem.replace("\n","\\n"); open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8").write("pem<<ENDPEM\n"+flat+"\nENDPEM\n")'

      - name: Hostname for Traefik
        id: host
        env:
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
        run: |
          host="${PUBLIC_ORIGIN#http://}"
          host="${host#https://}"
          host="${host%%/*}"
          host="${host%%:*}"
          if [ -z "$host" ]; then
            echo "::error::PUBLIC_ORIGIN must include a hostname, e.g. https://sf.genaipeople.com"
            exit 1
          fi
          echo "console_host=$host" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build app image
        run: docker build -f infra/Dockerfile.api --target api -t factory-console-app:latest .

      - name: Build web image
        run: docker build -f infra/Dockerfile.web -t factory-console-web:latest .

      - name: Save images to tarballs
        run: |
          docker save factory-console-app:latest | gzip > factory-console-app.tar.gz
          docker save factory-console-web:latest | gzip > factory-console-web.tar.gz

      - name: Stage compose file
        run: cp infra/docker-compose.deploy.yml docker-compose.yml

      - name: Prepare deploy directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail
            mkdir -p "$HOME/factory-console"

      - name: Transfer image tarballs
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          timeout: 120s
          command_timeout: 30m
          source: "factory-console-app.tar.gz,factory-console-web.tar.gz"
          target: "/tmp/"

      - name: Transfer compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "docker-compose.yml"
          target: "~/factory-console/"

      - name: Deploy on host
        uses: appleboy/ssh-action@v1.0.3
        env:
          CONSOLE_HOST: ${{ steps.host.outputs.console_host }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          CONSOLE_MASTER_KEY: ${{ secrets.CONSOLE_MASTER_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ steps.appkey.outputs.pem }}
          GITHUB_APP_WEBHOOK_SECRET: ${{ secrets.GH_APP_WEBHOOK_SECRET }}
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          ORCHESTRATOR_URL: ${{ vars.ORCHESTRATOR_URL }}
          ORCHESTRATOR_DISPATCH_TOKEN: ${{ secrets.ORCHESTRATOR_DISPATCH_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          timeout: 60s
          command_timeout: 30m
          envs: CONSOLE_HOST,PUBLIC_ORIGIN,CONSOLE_MASTER_KEY,DB_PASSWORD,ANTHROPIC_API_KEY,GITHUB_APP_ID,GITHUB_APP_PRIVATE_KEY,GITHUB_APP_WEBHOOK_SECRET,GITHUB_OAUTH_CLIENT_ID,GITHUB_OAUTH_CLIENT_SECRET,ORCHESTRATOR_URL,ORCHESTRATOR_DISPATCH_TOKEN
          script: |
            set -euo pipefail

            if [ -z "${CONSOLE_HOST:-}" ]; then
              echo "CONSOLE_HOST is empty — set PUBLIC_ORIGIN on the production environment." >&2
              exit 1
            fi

            DEPLOY_DIR="$HOME/factory-console"
            cd "$DEPLOY_DIR"

            if docker compose version >/dev/null 2>&1; then
              DC=(docker compose)
            else
              DC=(docker-compose)
            fi

            for img in factory-console-app factory-console-web; do
              docker load < "/tmp/${img}.tar.gz"
              rm -f "/tmp/${img}.tar.gz"
            done

            # Upsert keys into .env. Empty values are skipped so an existing
            # host entry (e.g. ANTHROPIC_API_KEY) is preserved.
            # GitHub App secrets come from env_file only — do not also put
            # ${GITHUB_APP_*} in compose `environment:` or an empty
            # interpolation would blank them (same gotcha as sales-os).
            touch .env
            chmod 600 .env
            if [ -n "${ORCHESTRATOR_DISPATCH_TOKEN:-}" ] && [ -z "${ORCHESTRATOR_URL:-}" ]; then
              ORCHESTRATOR_URL=http://factory-orchestrator:8080
            fi
            for KEY in CONSOLE_HOST PUBLIC_ORIGIN CONSOLE_MASTER_KEY DB_PASSWORD \
                       ANTHROPIC_API_KEY GITHUB_APP_ID GITHUB_APP_PRIVATE_KEY \
                       GITHUB_APP_WEBHOOK_SECRET GITHUB_OAUTH_CLIENT_ID \
                       GITHUB_OAUTH_CLIENT_SECRET ORCHESTRATOR_URL \
                       ORCHESTRATOR_DISPATCH_TOKEN; do
              VALUE="${!KEY-}"
              [ -z "$VALUE" ] && continue
              TMP="$(mktemp)"
              grep -v "^${KEY}=" .env > "$TMP" || true
              printf '%s=%s\n' "$KEY" "$VALUE" >> "$TMP"
              mv "$TMP" .env
            done
            chmod 600 .env

            docker network inspect lighthouse-network >/dev/null 2>&1 || \
              docker network create lighthouse-network

            "${DC[@]}" up -d --remove-orphans

            echo "Waiting for api to become healthy..."
            for attempt in $(seq 1 60); do
              STATE=$(docker inspect -f '{{.State.Health.Status}}' factory-console-api-1 2>/dev/null || echo missing)
              if [ "$STATE" = "healthy" ]; then
                echo "api healthy"
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "api did not become healthy (last state: $STATE)" >&2
                "${DC[@]}" ps
                "${DC[@]}" logs --tail 100 api
                exit 1
              fi
              sleep 3
            done

            docker image prune -f >/dev/null || true
            echo "Deployment completed. Console reachable at https://${CONSOLE_HOST}/"
