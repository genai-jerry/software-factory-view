version: 2
# Monthly and grouped: weekly bumps opened a dozen pull requests at a time,
# and the major ones (TypeScript, zod, node, nginx) are upgrades to plan, not
# to merge as they arrive.
updates:
  - package-ecosystem: npm   # covers the pnpm workspace
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
