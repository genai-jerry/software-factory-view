# One public origin: static SPA + reverse-proxied API. Same-origin cookies,
# no CORS surface, strict headers (plan 02 §1a).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://avatars.githubusercontent.com data:; connect-src 'self'; frame-ancestors 'none'" always;

    # Docker's embedded DNS, with a variable upstream so nginx re-resolves it.
    # A bare proxy_pass hostname is resolved once at startup and cached, so a
    # recreated api container (new IP) 502s until the web container restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8787;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /auth/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /webhooks/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5m;
    }
    # The App-manifest handshake is server-rendered HTML on /setup/github-app,
    # and GitHub redirects back to /setup/github-app/callback. Both must reach
    # the api; the trailing slash keeps bare /setup on the SPA screen.
    location /setup/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }
}
