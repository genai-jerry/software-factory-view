# One public origin: static SPA + reverse-proxied API. Same-origin cookies,
# no CORS surface, strict headers (plan 02 §1a).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx listens on :80 inside the container, but the browser reaches it on
    # whatever compose published (WEB_HOST_PORT, e.g. :8081) or through a
    # proxy. Absolute redirects would be built from the container port and
    # send the browser to http://localhost/setup/, dropping the host port.
    # Relative Location headers keep whatever origin the browser is already on.
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://avatars.githubusercontent.com data:; connect-src 'self'; frame-ancestors 'none'" always;

    # Variable upstream so nginx re-resolves on each request. A bare proxy_pass
    # hostname is resolved once at startup and cached, so a recreated api
    # container (new IP) 502s until the web container restarts.
    # Docker Compose / Hostinger: 127.0.0.11 / http://api:8787 (image defaults).
    resolver ${NGINX_RESOLVER};
    set $api_upstream ${API_UPSTREAM};

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /auth/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location /webhooks/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 5m;
    }
    # The App-manifest handshake is server-rendered HTML on /setup/github-app,
    # GitHub's App setup URL lands on /setup/install after an install, and
    # GitHub redirects the manifest callback to /setup/github-app/callback.
    # All of /setup/ must reach the api. A prefix location /setup/ with
    # proxy_pass also 301s the slashless /setup onto /setup/ — that is the
    # opposite of "keep bare /setup on the SPA", and it is what drops the
    # published port. Pin the exact path on the SPA instead.
    location = /setup {
        try_files /index.html =404;
    }
    location /setup/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }
}
