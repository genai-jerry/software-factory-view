# Production deploy compose. Images are built in CI and loaded onto the host
# with `docker load`; this file is image-only (no build:) and lives at
# $HOME/factory-console/docker-compose.yml alongside .env.
#
# Local development uses the root docker-compose.yml (build:).
#
# Traefik on lighthouse-network routes Host(${CONSOLE_HOST}) to web:80.
# nginx in web proxies /api /auth /webhooks /setup/ to http://api:8787 on the
# compose default network — do not publish host ports or Traefik-expose api.
# api and worker also join lighthouse-network so they can reach the LangGraph
# orchestrator at http://factory-orchestrator:8080 (ORCHESTRATOR_URL in .env).

name: factory-console

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: console
      POSTGRES_PASSWORD: ${DB_PASSWORD:-console}
      POSTGRES_DB: console
    volumes:
      - software-factory-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U console"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - software-factory-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: factory-console-app:latest
    pull_policy: never
    restart: unless-stopped
    command: ["node", "apps/api/dist/index.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DEV_FAKE_LOGIN: "0"
      DATABASE_URL: postgres://console:${DB_PASSWORD:-console}@postgres:5432/console
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 40s
    networks:
      - default
      - lighthouse-network

  worker:
    image: factory-console-app:latest
    pull_policy: never
    restart: unless-stopped
    command: ["node", "apps/worker/dist/index.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DEV_FAKE_LOGIN: "0"
      DATABASE_URL: postgres://console:${DB_PASSWORD:-console}@postgres:5432/console
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - lighthouse-network

  web:
    image: factory-console-web:latest
    pull_policy: never
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:8787
      NGINX_RESOLVER: 127.0.0.11 valid=10s ipv6=off
    depends_on:
      api:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=lighthouse-network
      # Console must win if orchestrator PUBLIC_BASE_URL was set to the same host.
      - traefik.http.routers.factory-console.priority=100
      - traefik.http.routers.factory-console.rule=Host(`${CONSOLE_HOST}`)
      - traefik.http.routers.factory-console.entrypoints=websecure
      - traefik.http.routers.factory-console.tls=true
      - traefik.http.routers.factory-console.tls.certresolver=letsencrypt
      - traefik.http.services.factory-console.loadbalancer.server.port=80
      - traefik.http.routers.factory-console-http.rule=Host(`${CONSOLE_HOST}`)
      - traefik.http.routers.factory-console-http.entrypoints=web
      - traefik.http.routers.factory-console-http.middlewares=factory-console-https
      - traefik.http.middlewares.factory-console-https.redirectscheme.scheme=https
      # Old hostname (LEGACY_CONSOLE_HOST, e.g. sf.genaipeople.com) keeps a
      # certificate and redirects every path to https://${CONSOLE_HOST}.
      # 302, not 301, so browsers do not cache it while the move settles.
      # Machine callers that do not follow redirects (GitHub webhooks, OAuth
      # callbacks) must be pointed at CONSOLE_HOST directly.
      - traefik.http.routers.factory-console-legacy.priority=100
      - traefik.http.routers.factory-console-legacy.rule=Host(`${LEGACY_CONSOLE_HOST}`)
      - traefik.http.routers.factory-console-legacy.entrypoints=websecure
      - traefik.http.routers.factory-console-legacy.tls=true
      - traefik.http.routers.factory-console-legacy.tls.certresolver=letsencrypt
      - traefik.http.routers.factory-console-legacy.middlewares=factory-console-moved
      - traefik.http.routers.factory-console-legacy-http.priority=100
      - traefik.http.routers.factory-console-legacy-http.rule=Host(`${LEGACY_CONSOLE_HOST}`)
      - traefik.http.routers.factory-console-legacy-http.entrypoints=web
      - traefik.http.routers.factory-console-legacy-http.middlewares=factory-console-moved
      - traefik.http.middlewares.factory-console-moved.redirectregex.regex=^https?://[^/]+(.*)
      - traefik.http.middlewares.factory-console-moved.redirectregex.replacement=https://${CONSOLE_HOST}$${1}
      - traefik.http.middlewares.factory-console-moved.redirectregex.permanent=false
    networks:
      - default
      - lighthouse-network

volumes:
  software-factory-pgdata:
    name: software-factory-pgdata
  software-factory-redisdata:
    name: software-factory-redisdata

networks:
  lighthouse-network:
    name: lighthouse-network
    external: true
